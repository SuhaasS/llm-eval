; Without this file `from calc import add` in tests/test_calc.py raises
; ModuleNotFoundError, because pytest's rootdir-insertion puts the test file's
; own directory (tests/) on sys.path, not the repo root where calc.py lives.
;
; That failure is indistinguishable, to an agent reading the output, from the
; bug it was asked to fix -- and it does not go away when the bug IS fixed.
; The fixture would then be red before and red after, so a run that solved the
; task correctly and a run that did nothing produce the same evidence.
;
; A flat repo whose tests import from the root is the ordinary shape, which is
; why the fixture keeps it rather than moving calc.py into a package.
[pytest]
pythonpath = .
testpaths = tests
