# Fault-injection proxy config (spec section 6.6). NOT for real runs.
#
# Every deployment here answers from mock_response, so the whole capture path
# -- agent -> proxy -> callback -> wire log -> run record -- can be exercised
# with no credentials and no spend. That matters more than convenience: a
# gate that costs money to run is a gate that stops being run.
#
# The error deployments raise REAL exceptions, not canned error bodies.
# Verified in litellm 1.95.0 (llms/anthropic/experimental_pass_through/
# messages/utils.py): these three sentinel strings are recognised on the
# /v1/messages route and raise the corresponding litellm exception, which
# carries the status code classify_exclusion maps to a pre-registered
# reason:
#
#   litellm.RateLimitError             429 -> api_throttle
#   litellm.InternalServerError        500 -> api_5xx
#   litellm.ContextWindowExceededError 400 -> not an infra failure, by design
#
# There is no sentinel for Timeout (408), so that branch stays unit-tested.
# Stated rather than left as an apparent gap.

model_list:
  - model_name: mock-ok
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: not-used-by-mock
      mock_response: "the mock model replies"

  - model_name: mock-throttle
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: not-used-by-mock
      mock_response: "litellm.RateLimitError"

  - model_name: mock-5xx
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: not-used-by-mock
      mock_response: "litellm.InternalServerError"

litellm_settings:
  # Points at the module-level INSTANCE, never the class. get_instance_fn
  # resolves a dotted path with getattr and returns it as-is; LiteLLM then
  # dispatches on isinstance(callback, CustomLogger), so a class object is
  # skipped in silence -- no wire log, no error. The production config now
  # carries the same line, for the same reason: the harness process makes no
  # model calls, so registering a callback there observes nothing.
  # Two entries, and the second is not optional in any config. The
  # tool-id patch must be present wherever a proxy is started, or the
  # offline gate and the fault-injection suite certify an UNPATCHED
  # topology under the same name as the patched one.
  #
  # bakeoff.litellm_patches applies on construction and is imported by
  # nothing in the harness -- that separation is what keeps the harness
  # process's litellm unpatched. See that module for the defect.
  callbacks:
    - bakeoff.proxy_callback.instance
    - bakeoff.litellm_patches.instance
  drop_params: false
  set_verbose: false

router_settings:
  # Measured against litellm 1.95.0. `_should_cooldown_deployment` has four
  # branches; three are guarded by `is_single_deployment_model_group` and the
  # fourth -- `elif litellm._should_retry(status_code) is False` -- is not.
  # _should_retry(401) and (403) are both False, so ONE auth failure cools the
  # deployment down for DEFAULT_COOLDOWN_TIME_SECONDS (5).
  #
  # Every model group below is single-deployment: the model_names are distinct
  # by design, so LiteLLM cannot load-balance and randomise transport per call.
  # There is therefore nothing to fail over TO, and the cooldown buys nothing
  # while costing the diagnosability of every auth failure -- `num_retries: 3`
  # retries into it and gets RouterRateLimitError, a plain ValueError with NO
  # status_code, so the wire log's last entry reads "No deployments available"
  # at status None instead of naming the credential problem that caused it.
  #
  # The other unguarded branch needs 1000 requests in one minute
  # (SINGLE_DEPLOYMENT_TRAFFIC_FAILURE_THRESHOLD) and is unreachable here. So in
  # this configuration the cooldown mechanism fires on essentially nothing
  # except an auth failure, and disabling it loses nothing.
  #
  # Applied to every deployment identically -- not a section 5.3 divergence.
  disable_cooldowns: true


general_settings:
  # No retries here, unlike production. A retry would turn one injected 429
  # into four wire entries and make the test assert on retry behaviour
  # instead of on capture. The retry-versus-final-error rule is covered by
  # its own unit test.
  num_retries: 0
  request_timeout: 60
