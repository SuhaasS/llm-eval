# Self-hosted LiteLLM proxy calling Bedrock directly (spec section 2).
# No third-party hop: this runs inside the Pindrop AWS account.
#
# Model IDs verified against the AWS Bedrock model cards on 2026-08-05.
# Routing itself is NOT verified here -- no credentials in the authoring
# environment. Phase 0c's smoke test (Task 12) is the gate.
#
# Both transports are configured so Phase 0 can pick per arm from evidence
# rather than assumption, and so an adapter failure can be told apart from
# model weakness (spec section 6.4):
#
#   bedrock-mantle   AWS-recommended; the ONLY route Gemma 4 31B supports
#   bedrock-runtime  Converse/Invoke; unavailable for Gemma
#
# bedrock-runtime is two routes wearing one prefix, and which one a deployment
# gets is decided by the model id rather than by anything in this file. Claude
# models take Invoke with a native Anthropic body; everything else takes the
# openai -> Converse bridge, which puts the model's own tool-call ids into
# toolUseId under a character class Bedrock enforces server-side. See the
# commented-out kimi-k2-5-runtime block for what that costs.
#
# Every model_name is distinct on purpose. LiteLLM treats repeated
# model_name values as one load-balanced deployment group and round-robins
# between them, which would randomize transport per call and confound both
# latency and tool-translation results.
#
# model_name doubles as the PRICE_BOOK key in bakeoff.costs -- a name here
# that the price book does not know raises UnknownModelError mid-run.
#
# Paths differ per model family and are not interchangeable:
#   Sonnet 5   /anthropic/v1  (Anthropic Messages)
#   Gemma      /openai/v1     (OpenAI Chat Completions)
#   Nemotron   /v1            (OpenAI Chat Completions)
#   Kimi       /v1            (OpenAI Chat Completions)
#
# CREDENTIALS. The two transports authenticate differently and the ENV VAR
# NAME carrying the mantle token is load-bearing. LiteLLM's bedrock/ handler
# resolves auth as (base_aws_llm.get_request_headers, verified 1.95.0):
#
#     if api_key is not None:      bearer = api_key
#     else:                        bearer = os.environ["AWS_BEARER_TOKEN_BEDROCK"]
#     if bearer:  Authorization: Bearer ...     else:  SigV4Auth(...)
#
# The runtime deployments below carry no api_key -- SigV4 is the whole point
# of them -- so a proxy process with AWS_BEARER_TOKEN_BEDROCK set sends
# bearer auth to bedrock-runtime and every runtime arm fails with
#   not authorized to perform: bedrock:CallWithBearerToken
# The mantle token is therefore passed as BAKEOFF_MANTLE_TOKEN, a name
# LiteLLM does not look up. The mantle deployments name it explicitly, which
# takes the api_key branch; the runtime deployments find nothing and sign.
# Renaming this back to AWS_BEARER_TOKEN_BEDROCK breaks all three runtime
# arms at once, and only when both transports are served by one proxy.
#
# SAMPLING (spec section 5.3). Claude Code has no temperature flag, so this
# file is the only layer that can set it. Values verified against each
# lab's published guidance on 2026-08-06:
#
#   claude-sonnet-5   OMITTED. Setting temperature, top_p or top_k to a
#                     non-default value returns 400. Configuring one here
#                     would fail every call on the reference arm.
#   gemma-4-31b       temperature 1.0, top_p 0.95
#   nemotron-3-...    temperature 1.0, top_p 0.95 (all tasks, per NVIDIA)
#   kimi-k2-5         temperature 1.0, top_p 0.95 (thinking mode). Moonshot
#                     documents temperature 0 causing multi-minute stalls.
#
# Section 5.3 says "0.6 (or lab-recommended)". Lab-recommended is what is
# used: a single uniform number would 400 one arm and stall another, which
# is the section 5.4 failure mode -- a config choice scored as a model
# difference. The constant across arms is the policy, not the value, so
# config_digest deliberately excludes temperature (see claude_runner).
#
# NOT VERIFIED HERE: that the proxy actually sends these. LiteLLM merges
# litellm_params as defaults and a temperature in Claude Code's own request
# body may win. Only the wire log shows what was sent -- Phase 0c (Task 12)
# reads it back from wire.jsonl rather than trusting this file.

model_list:
  # ---- bedrock-mantle (primary) ----
  - model_name: claude-sonnet-5
    # api_base deliberately omits the /v1 the endpoint actually serves:
    # LiteLLM's anthropic provider appends "/v1/messages" itself, so the
    # documented .../anthropic/v1 base produces .../anthropic/v1/v1/messages
    # and 404s with an empty error body. Verified 2026-08-05 -- raw POST to
    # .../anthropic/v1/messages returns 200 with this same model id, so the
    # fault was URL construction, not the endpoint or the model name.
    litellm_params:
      model: anthropic/anthropic.claude-sonnet-5
      additional_drop_params: ["context_management", "output_config"]
      api_base: https://bedrock-mantle.us-east-1.api.aws/anthropic
      api_key: os.environ/BAKEOFF_MANTLE_TOKEN

  - model_name: gemma-4-31b
    # Mantle only. Gemma supports neither Converse nor Invoke, and its path
    # is /openai/v1 rather than the /v1 the other OpenAI-compatible arms use.
    # Known constraints (spec section 6.4 adapter class, not model weakness):
    #   - no parallel tool calls; one tool call per turn
    #   - reasoning content is returned only by the Responses API, so
    #     TokenUsage.reasoning reads zero on this path
    #
    # NO top_p, AND THAT IS FORCED. On 2026-08-12 the /openai/v1 route began
    # validating this model under OpenAI's reasoning-model contract, which
    # rejects any non-default top_p outright:
    #   Unsupported parameter: 'top_p' is not supported with this model.
    # Measured by request ladder the same day -- temperature 1.0 passes and
    # 0.6 does not ("Unsupported value: 'temperature' does not support 0.6"),
    # so the lab-recommended temperature survives and the lab-recommended
    # top_p cannot.
    #
    # This is the position claude-sonnet-5 has always been in and it is handled
    # the same way: omit rather than fight, and record it. Section 5.3's
    # constant across arms is the POLICY -- lab-recommended unless the route
    # refuses it -- not the number, which is why nemotron and kimi keep
    # top_p 0.95 rather than being levelled down to match. It is a real
    # section 5.3 divergence and belongs in whatever publishes the comparison.
    #
    # The other two walls this route put up are in bakeoff.litellm_patches,
    # because neither can be expressed here: max_tokens has to become
    # max_completion_tokens, and reasoning_effort has to be pinned to "none"
    # or the route refuses `tools` entirely.
    litellm_params:
      model: openai/google.gemma-4-31b
      additional_drop_params: ["reasoning_effort"]
      api_base: https://bedrock-mantle.us-east-1.api.aws/openai/v1
      api_key: os.environ/BAKEOFF_MANTLE_TOKEN
      temperature: 1.0

  - model_name: nemotron-3-super-120b
    litellm_params:
      model: openai/nvidia.nemotron-super-3-120b
      additional_drop_params: ["reasoning_effort"]
      api_base: https://bedrock-mantle.us-east-1.api.aws/v1
      api_key: os.environ/BAKEOFF_MANTLE_TOKEN
      temperature: 1.0
      top_p: 0.95

  - model_name: kimi-k2-5
    litellm_params:
      model: openai/moonshotai.kimi-k2.5
      additional_drop_params: ["reasoning_effort"]
      api_base: https://bedrock-mantle.us-east-1.api.aws/v1
      api_key: os.environ/BAKEOFF_MANTLE_TOKEN
      temperature: 1.0
      top_p: 0.95

  # ---- bedrock-runtime (alternate; no Gemma entry) ----
  - model_name: claude-sonnet-5-runtime
    # Must use the us. geo inference profile: the model card lists the
    # In-Region runtime URL as N/A, so the bare ID cannot be invoked.
    # US geo also matches the data-residency posture behind choosing Bedrock.
    # No temperature/top_p here either -- same 400 as the mantle arm.
    litellm_params:
      model: bedrock/us.anthropic.claude-sonnet-5
      aws_region_name: us-east-1

  - model_name: nemotron-3-super-120b-runtime
    litellm_params:
      model: bedrock/nvidia.nemotron-super-3-120b
      aws_region_name: us-east-1
      temperature: 1.0
      top_p: 0.95

  # kimi-k2-5-runtime is COMMENTED OUT, not deleted: it is the fallback
  # transport if mantle ever breaks for Kimi the way it broke for Sonnet, and
  # what it would take to restore it is worth keeping next to it.
  #
  # It cannot be served as written. Below /v1/messages the bedrock/ route
  # splits by model, not by config (verified against litellm 1.95.0):
  # Claude models resolve to AmazonAnthropicClaudeMessagesConfig and go to the
  # Invoke endpoint with a native Anthropic body, never constructing a
  # toolUseId; everything else falls through to the openai -> Converse bridge,
  # where prompt_templates/factory.py copies the tool id verbatim into
  # BedrockToolUseBlock(toolUseId=) and BedrockToolResultBlock(toolUseId=).
  # Bedrock constrains that to [a-zA-Z0-9_-]{1,64} SERVER-side -- litellm
  # sanitizes tool NAMES on this path and never ids, so nothing fails locally.
  #
  # Kimi's ids are `functions.Read:0`, and the sanitizer that used to rewrite
  # them is deliberately gone (bakeoff.litellm_patches -- removing it is what
  # let Kimi drive the tool loop at all). So this deployment would send a colon
  # to Converse. Leaving it live left it one `--models kimi-k2-5-runtime` away
  # from a paid run, which is the only reason it was reachable.
  #
  # TO RESTORE: uncomment, then add bedrock/moonshotai.kimi-k2.5 to
  # CONVERSE_SAFE_TOOL_ID_MODELS in tests/test_config.py with the id shape it
  # actually returns as the evidence -- the allowlist entry is the measurement,
  # not the paperwork -- and smoke-test the arm before trusting it.
  #
  # - model_name: kimi-k2-5-runtime
  #   litellm_params:
  #     model: bedrock/moonshotai.kimi-k2.5
  #     aws_region_name: us-east-1
  #     temperature: 1.0
  #     top_p: 0.95

litellm_settings:
  # Wire capture, registered where the calls are actually made (spec
  # section 6.2). The agent runs in its own container and this proxy is a
  # third process, so a callback registered in the harness process observes
  # nothing -- that was Task 11's defect 15, and it produced records with
  # empty sampling, empty prompt and tool hashes and no error status while
  # looking complete.
  #
  # The dotted path must resolve to a module-level INSTANCE, and this is
  # the whole trap. Verified against litellm 1.95.0: get_instance_fn
  # resolves the path with getattr and returns it as-is, then
  # success_handler dispatches on isinstance(callback, CustomLogger). A
  # class -- `bakeoff.wire.BakeoffCallback` -- fails that check and is
  # skipped in SILENCE: no wire log, no error. `proxy_callback.instance`
  # exists precisely so this line can point at an object rather than a type.
  #
  # bakeoff.wire.BakeoffCallback still cannot be named here for a second
  # reason: it needs a per-run WireLogger and run_id, which no config
  # string can supply. The proxy-side callback instead attributes each call
  # by the X-Bakeoff-Run-Id header the harness stamps per run, and the
  # harness replays those lines through WireLogger afterwards so there is
  # still exactly one canonical artifact.
  # Two entries, and the second is not optional in any config. The
  # tool-id patch must be present wherever a proxy is started, or the
  # offline gate and the fault-injection suite certify an UNPATCHED
  # topology under the same name as the patched one.
  #
  # bakeoff.litellm_patches applies on construction and is imported by
  # nothing in the harness -- that separation is what keeps the harness
  # process's litellm unpatched. See that module for the defect.
  callbacks:
    - bakeoff.proxy_callback.instance
    - bakeoff.litellm_patches.instance

  # Route the three OpenAI-compatible arms through /v1/chat/completions
  # rather than /v1/responses. Without this LiteLLM sends any `openai/`
  # deployment's Anthropic Messages traffic to the Responses API, and
  # Bedrock answers 400: "The model 'nvidia.nemotron-super-3-120b' does not
  # support the '/v1/responses' API". Measured on the Phase 0c live run,
  # 2026-08-07, for both Nemotron and Kimi.
  #
  # This is a section 6.4 adapter setting, not a model finding. The failure
  # it fixes was identical on every candidate arm and would have read as
  # three models unable to drive Claude Code.
  use_chat_completions_url_for_anthropic_messages: true

  # Named one at a time, never a blanket `drop_params: true`. A blanket drop
  # would also silently discard temperature or max_tokens if a provider ever
  # rejected one, and section 5.3 sampling would then be unapplied with
  # nothing in the record saying so. Each entry below is a measured Bedrock
  # rejection from the Phase 0c live run, 2026-08-07:
  #
  #   reasoning_effort   the chat-completions bridge derives it from Claude
  #                      Code's `thinking` block, and LITELLM rejects it --
  #                      see the correction below; this entry is retained as
  #                      a backstop, not as the mechanism
  #   context_management  Claude Code sends it; LiteLLM turns it into an
  #   output_config       anthropic-beta header, and mantle answers
  #                       "invalid beta flag"
  #
  # CORRECTION, 2026-08-12. Until today this block said Bedrock rejected
  # reasoning_effort "for all three candidate models". That was wrong, and it
  # cost the gemma arm. Probed with raw httpx, bypassing litellm entirely:
  # Bedrock ACCEPTS reasoning_effort on all three, and "high" measurably
  # changes output (gemma 240 -> 580 completion tokens, kimi 171 -> 717). The
  # rejection is litellm's own _check_valid_arg, because
  # OpenAIGPTConfig.get_supported_openai_params omits the parameter for a
  # non-o-series model. A client-side guard was recorded as a provider
  # constraint, and the drop below rested on that misattribution.
  #
  # The per-deployment entries are KEPT, but they are no longer the mechanism.
  # bakeoff.litellm_patches pins reasoning_effort to "none" downstream of the
  # param mapping -- it has to, because gemma's route refuses `tools` unless
  # the value is explicitly "none", and a drop cannot express a value. The
  # entries stay so that a patch which fails to apply produces a loud
  # UnsupportedParamsError rather than silently forwarding the "medium" that
  # litellm derives from Claude Code's `thinking: {"type": "adaptive"}`.
  additional_drop_params:
    - reasoning_effort
    - context_management
    - output_config

  drop_params: false          # surface unsupported params instead of hiding them
  set_verbose: false

router_settings:
  # Measured against litellm 1.95.0. `_should_cooldown_deployment` has four
  # branches; three are guarded by `is_single_deployment_model_group` and the
  # fourth -- `elif litellm._should_retry(status_code) is False` -- is not.
  # _should_retry(401) and (403) are both False, so ONE auth failure cools the
  # deployment down for DEFAULT_COOLDOWN_TIME_SECONDS (5).
  #
  # Every model group below is single-deployment: the model_names are distinct
  # by design, so LiteLLM cannot load-balance and randomise transport per call.
  # There is therefore nothing to fail over TO, and the cooldown buys nothing
  # while costing the diagnosability of every auth failure -- `num_retries: 3`
  # retries into it and gets RouterRateLimitError, a plain ValueError with NO
  # status_code, so the wire log's last entry reads "No deployments available"
  # at status None instead of naming the credential problem that caused it.
  #
  # The other unguarded branch needs 1000 requests in one minute
  # (SINGLE_DEPLOYMENT_TRAFFIC_FAILURE_THRESHOLD) and is unreachable here. So in
  # this configuration the cooldown mechanism fires on essentially nothing
  # except an auth failure, and disabling it loses nothing.
  #
  # Applied to every deployment identically -- not a section 5.3 divergence.
  disable_cooldowns: true


general_settings:
  # Retries are logged as infra events, never silently absorbed. Each retry
  # is its own callback invocation, which is why the wire log counts calls
  # rather than turns.
  num_retries: 3
  request_timeout: 900
