# Offline half of the Phase 0c smoke test. No credentials, no spend.
#
# The topology this exercises is the real one: the pinned container runs the
# real Claude Code binary, which talks to this proxy in another container
# over an internal Docker network, and the proxy-side callback records the
# call. Only the model is fake.
#
# api_base points at fixtures/anthropic_stub.py, a real streaming Anthropic
# endpoint, NOT at a `mock_response` deployment. That distinction is the
# whole reason this file exists. LiteLLM's mock short-circuits inside
# anthropic_messages before the provider call, so a STREAMING request never
# reaches the streaming wrapper that fires the success callback on stream
# completion. Measured against litellm 1.95.0 with claude 2.1.220: two
# calls made, only the non-streaming one captured. Every real Claude Code
# call is streaming, so a gate built on mocks would certify capture that
# does not happen -- the same class of defect as Task 11's defect 15.
#
# `/v1/messages` is appended by LiteLLM's anthropic provider, so api_base
# carries neither it nor a trailing /v1, exactly as the mantle Sonnet arm
# in litellm_config.yaml does.
#
# The deployment is named `claude-sonnet-5`, a REAL arm name, on purpose:
# model_name doubles as the PRICE_BOOK key, so a name like `mock-ok` raises
# UnknownModelError inside cost_usd. assemble_record catches that, leaving a
# record whose turns, tokens and cost are all zero with only
# trajectory_parse_error set -- the offline gate would be measuring the
# price book rather than the topology.

model_list:
  - model_name: claude-sonnet-5
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_base: http://stub:8080
      api_key: not-checked-by-the-stub

  # Carries sampling, and that is the point of having a second arm here.
  # Section 5.3 puts sampling entirely in proxy config because Claude Code
  # has no temperature flag, and Task 11 could not tell whether a
  # deployment-level temperature survives to the wire: it was absent from
  # optional_params, litellm_params and standard_logging_object on the mock
  # path, which short-circuits before provider param transformation. A real
  # provider call answers the question, and this arm asks it for free.
  #
  # Values match the production gemma-4-31b arm so the answer transfers.
  - model_name: gemma-4-31b
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_base: http://stub:8080
      api_key: not-checked-by-the-stub
      temperature: 1.0
      top_p: 0.95

  # The only offline arm that reaches the openai->anthropic adapter, and the
  # reason it exists. The two arms above use the `anthropic/` provider, which
  # bypasses that adapter entirely -- so the 2026-08-07 tool-id defect, where
  # LiteLLM rewrote Kimi's `functions.Read:0` to `functions_Read_0` and broke
  # its tool loop, was structurally invisible to this gate and cost a live run
  # to find.
  #
  # The stub answers /v1/chat/completions with a Kimi-shaped tool_call id and
  # REJECTS a tool_call_id it never issued. So if bakeoff.litellm_patches ever
  # stops applying, the id comes back mangled, the stub 400s, and this arm goes
  # red -- which is the only way the gate can tell a live patch from a dead one.
  #
  # Named kimi-k2-5 because model_name doubles as the PRICE_BOOK key.
  - model_name: kimi-k2-5
    litellm_params:
      model: openai/kimi-k2-5-stub
      # Per-deployment, exactly as the production kimi arm carries it. The
      # global litellm_settings.additional_drop_params below does NOT reach an
      # openai/ deployment's param validation -- measured here: with only the
      # global entry the arm still 400s on reasoning_effort.
      additional_drop_params: ["reasoning_effort"]
      api_base: http://stub:8080/v1
      api_key: not-checked-by-the-stub
      temperature: 1.0
      top_p: 0.95

litellm_settings:
  # The same registration the production config now uses, so the offline
  # gate exercises the real capture path rather than a test-only one.
  # Two entries, and the second is not optional in any config. The
  # tool-id patch must be present wherever a proxy is started, or the
  # offline gate and the fault-injection suite certify an UNPATCHED
  # topology under the same name as the patched one.
  #
  # bakeoff.litellm_patches applies on construction and is imported by
  # nothing in the harness -- that separation is what keeps the harness
  # process's litellm unpatched. See that module for the defect.
  callbacks:
    - bakeoff.proxy_callback.instance
    - bakeoff.litellm_patches.instance
  # Must match litellm_config.yaml. Without it LiteLLM sends an `openai/`
  # deployment's Anthropic Messages traffic to the /v1/responses API instead
  # of /v1/chat/completions -- which is the production defect measured on
  # 2026-08-07, and it also means the offline gate would exercise different
  # routing than the run it is meant to certify. A setting that differs
  # between these two files is a section 5.2 divergence in the gate itself.
  use_chat_completions_url_for_anthropic_messages: true

  # Also mirrored from litellm_config.yaml, and for the same reason: the
  # chat-completions bridge derives reasoning_effort from Claude Code's
  # `thinking` block, and an openai/ deployment that has not dropped it 400s
  # before reaching the provider. Named one at a time, never a blanket
  # `drop_params: true`, so a future unsupported param surfaces instead of
  # being silently discarded.
  additional_drop_params:
    - reasoning_effort
    - context_management
    - output_config

  drop_params: false
  set_verbose: false

router_settings:
  # Measured against litellm 1.95.0. `_should_cooldown_deployment` has four
  # branches; three are guarded by `is_single_deployment_model_group` and the
  # fourth -- `elif litellm._should_retry(status_code) is False` -- is not.
  # _should_retry(401) and (403) are both False, so ONE auth failure cools the
  # deployment down for DEFAULT_COOLDOWN_TIME_SECONDS (5).
  #
  # Every model group below is single-deployment: the model_names are distinct
  # by design, so LiteLLM cannot load-balance and randomise transport per call.
  # There is therefore nothing to fail over TO, and the cooldown buys nothing
  # while costing the diagnosability of every auth failure -- `num_retries: 3`
  # retries into it and gets RouterRateLimitError, a plain ValueError with NO
  # status_code, so the wire log's last entry reads "No deployments available"
  # at status None instead of naming the credential problem that caused it.
  #
  # The other unguarded branch needs 1000 requests in one minute
  # (SINGLE_DEPLOYMENT_TRAFFIC_FAILURE_THRESHOLD) and is unreachable here. So in
  # this configuration the cooldown mechanism fires on essentially nothing
  # except an auth failure, and disabling it loses nothing.
  #
  # Applied to every deployment identically -- not a section 5.3 divergence.
  disable_cooldowns: true


general_settings:
  # Matches production, unlike the fault-injection config: this run is about
  # whether the ordinary path works, and production retries.
  num_retries: 3
  request_timeout: 900
