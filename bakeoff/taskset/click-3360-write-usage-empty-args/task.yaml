task_id: click-3360-write-usage-empty-args
task_version: 1
tier: B
stratum: small-edit

repo:
  url: https://github.com/pallets/click.git
  # merge_commit^1 -- the real parent of the merge, not the PR's recorded
  # base.sha. The base branch advanced between the PR being opened and merged
  # (7c99ebe -> 63274a7), and diffing against the stale one would put
  # unrelated commits into the reference.
  base_sha: 63274a79d08fdc5c19220696144489f7144a8547
  # base_sha + the test half, committed with a fixed identity and date. Pinned
  # so that a re-cut patch or a different git moving the start state is a load
