[project]
name = "bakeoff"
version = "0.1.0"
requires-python = ">=3.11"
# boto3: LiteLLM signs the bedrock/ (bedrock-runtime) arms with SigV4 through
# boto3. The bedrock-mantle arms are bearer-token HTTP and do not need it.
#
# litellm is PINNED, not floored, and this is not caution. `litellm_patches`
# monkeypatches litellm internals -- `OpenAIConfig.map_openai_params`,
# `AnthropicStreamWrapper.__init__`, the adapter's pre-request hook -- and
# every behavioural claim in that module is annotated "verified against
# litellm 1.95.0". Its own guards cannot be trusted to catch drift: two of
# them use `hasattr` against names a base class declares, so they stay true
# after the thing they check is gone. A floor lets `pip install -U` turn a
# silently inactive patch into an arm that fails 9/9 and reads as a weak
# model. Bump deliberately, re-run the patch probes, re-read the annotations.
#
# pyyaml is a RUNTIME dependency: `tasks.py` imports it to read `task.yaml`,
# which is the input path for every real task. It sat under `dev` while the
# only yaml consumers were tests, and a non-dev install now fails at task
# load rather than at import.
dependencies = [
    "docker>=7.0",
    "litellm==1.95.0",
    "boto3>=1.34",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
markers = [
    "integration: requires Docker or network",
    # A SUBSET of `integration`, always carried beside it, never alone. These
    # build a task image and hit the repo mirror, which the section 6.6 logger
    # gate must not do -- CLAUDE.md pins that gate as offline, no credentials,
    # no spend, and folding these in would silently change what it needs.
    # `verify_logger.py` selects `-m "integration and not task_image"`; the
    # default `addopts` keeps them out of the unit run through `integration`.
    "task_image: builds a task image and needs the repo mirror",
]
testpaths = ["tests"]
# The repo root, so tests can import scripts/ the way an operator runs it.
# scripts/smoke_test.py holds the Phase 0c go/no-go criteria, and criteria
# that are only exercised by the paid run they gate are not gated at all.
pythonpath = ["."]
# Integration tests are opt-in: they need a Docker daemon, so running them by
# default would turn "no daemon here" into a suite-wide collection error.
# Override with `-m integration` on the command line.
addopts = "-m 'not integration'"
