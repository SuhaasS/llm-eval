[project]
name = "bakeoff"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["docker>=7.0", "litellm>=1.40"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov", "pyyaml"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
markers = ["integration: requires Docker or network"]
testpaths = ["tests"]
# Integration tests are opt-in: they need a Docker daemon, so running them by
# default would turn "no daemon here" into a suite-wide collection error.
# Override with `-m integration` on the command line.
addopts = "-m 'not integration'"
